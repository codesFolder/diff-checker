<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiffMaster | Pro Difference Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        :root {
            --bg: #1e1e1e;
            --header: #252526;
            --border: #333;
            --accent: #007acc;
            --text: #cccccc;
            --input-bg: #3c3c3c;
            --input-text: #fff;
            --tab-active-bg: var(--bg);
            --tab-active-text: #fff;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* HEADER & TOOLBAR */
        header {
            height: 60px;
            background: var(--header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* CONTROLS */
        select,
        input[type="text"],
        input[type="number"] {
            height: 32px;
            background: var(--input-bg);
            color: var(--input-text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0 10px;
            outline: none;
        }

        button {
            height: 32px;
            padding: 0 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--input-text);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        button:hover {
            background: #4a4a4a;
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        button.primary:hover {
            background: #0062a3;
        }

        /* TOGGLES */
        .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }

        /* Hide the actual checkbox */
        .toggle-label input[type="checkbox"] {
            display: none;
        }

        .toggle-switch {
            width: 36px;
            height: 18px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            position: relative;
            transition: 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 2px;
            width: 14px;
            height: 14px;
            background: var(--text);
            border-radius: 50%;
            transition: 0.3s;
        }

        input[type="checkbox"]:checked+.toggle-switch {
            background: var(--accent);
            border-color: var(--accent);
        }

        input[type="checkbox"]:checked+.toggle-switch::after {
            background: #fff;
            transform: translateX(18px);
        }

        /* TAB SYSTEM */
        .tabs {
            display: flex;
            gap: 5px;
            height: 100%;
            align-items: flex-end;
            margin-left: 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: transparent;
            color: #888;
            border-radius: 6px 6px 0 0;
            font-size: 13px;
            font-weight: 600;
        }

        .tab.active {
            background: var(--tab-active-bg);
            color: var(--tab-active-text);
            border-top: 2px solid var(--accent);
        }

        /* VIEWS */
        .view-container {
            flex: 1;
            position: relative;
            display: none;
        }

        .view-container.active {
            display: block;
        }

        #interactive-view.active {
            display: flex;
            /* Override block for flex layout */
        }

        /* MONACO EDITOR CONTAINER */
        #editor-container {
            width: 100%;
            height: 100%;
        }

        /* BATCH UPLOAD VIEW */
        #batch-view {
            padding: 40px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #batch-view.active {
            display: flex;
        }

        .batch-card {
            width: 600px;
            background: #252526;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .drop-zone {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
            cursor: pointer;
        }

        .drop-zone:hover {
            border-color: var(--accent);
            background: #2d2d30;
        }

        .file-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .file-item {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
        }

        .regex-group {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* VERSION SIDEBAR */
        #version-sidebar {
            width: 250px;
            background: var(--header);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), padding 0.3s;
            overflow: hidden;
            position: relative;
        }

        #version-sidebar.collapsed {
            width: 0;
            padding: 0;
            border-left: none;
        }

        .sidebar-header {
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            white-space: nowrap;
        }

        .version-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .version-item {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .version-item:hover {
            border-color: var(--accent);
        }

        .version-info {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .version-actions {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
        }

        .version-item:hover .version-actions {
            display: block;
        }

        .sidebar-controls {
            padding: 10px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
        }

        .regex-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <div style="display:flex; height:100%; align-items: center;">
            <div class="logo"><i class="ri-file-shred-line"></i> DiffMaster</div>
            <div class="tabs">
                <div class="tab active" onclick="switchView('interactive')">Interactive Editor</div>
                <div class="tab" onclick="switchView('batch')">Batch Report Generator</div>
            </div>
        </div>

        <div class="toolbar" id="interactive-toolbar">
            <select id="theme-select" onchange="changeTheme()">
                <option value="vs-dark">Dark</option>
                <option value="vs">Light</option>
                <option value="peach">Light Peach (Bookish)</option>
                <option value="hc-black">High Contrast</option>
                <option value="midnight">Midnight Blue</option>
            </select>

            <select id="lang-select" onchange="changeLang()">
                <option value="text/plain">Plain Text</option>
                <option value="python">Python</option>
                <option value="javascript">JavaScript</option>
                <option value="json">JSON</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>

            <label class="toggle-label" title="Show Inline vs Side-by-Side">
                <input type="checkbox" id="inline-toggle" onchange="toggleInline()">
                <div class="toggle-switch"></div>
                <span>Inline View</span>
            </label>

            <label class="toggle-label" title="Auto-compare on typing">
                <input type="checkbox" id="live-toggle" checked>
                <div class="toggle-switch"></div>
                <span>Live</span>
            </label>

            <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>

            <!-- INDENT -->
            <select id="indent-select" onchange="changeIndent()" title="Indentation">
                <option value="2">2 Spaces</option>
                <option value="4" selected>4 Spaces</option>
                <option value="8">8 Spaces</option>
            </select>

            <!-- REGEX -->
            <div style="display:flex; gap:5px; align-items:center;">
                <input type="text" id="editor-regex" placeholder="Regex Filter..." title="Enter regex to remove lines"
                    style="width: 100px;">
                <button onclick="applyEditorRegex()" title="Apply Regex Filter"><i class="ri-filter-line"></i></button>
            </div>

            <div style="width: 1px; height: 20px; background: var(--border); margin: 0 5px;"></div>

            <!-- ACTIONS -->
            <button onclick="saveVersion()" title="Save Version"><i class="ri-save-3-line"></i> Save</button>
            <button onclick="toggleVersions()" title="Toggle Versions Sidebar" id="toggle-sidebar-btn"><i
                    class="ri-history-line"></i></button>
            <button onclick="clearAll()"><i class="ri-delete-bin-line"></i> Clear</button>
        </div>
    </header>

    <div id="interactive-view" class="view-container active">
        <div style="flex: 1; display:flex; flex-direction:column; overflow:hidden;">
            <div id="editor-container"></div>
        </div>

        <div id="version-sidebar" class="collapsed">
            <div class="sidebar-header">
                <span><i class="ri-history-line"></i> Versions</span>
                <button class="close-btn" onclick="toggleVersions()"><i class="ri-close-line"></i></button>
            </div>

            <div class="version-list" id="version-list">
                <!-- Versions will render here -->
                <div style="text-align:center; color:#888; font-size:12px; margin-top:20px;">No saved versions</div>
            </div>

            <div class="sidebar-controls">
                <label class="toggle-label" style="justify-content: space-between;">
                    <span>Auto-Save</span>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="number" id="autosave-interval" value="30" style="width:40px; text-align:center;"
                            onchange="updateAutoSave()" min="5">
                        <span style="font-size:10px; color:#888;">sec</span>
                        <input type="checkbox" id="autosave-toggle" onchange="updateAutoSave()">
                        <div class="toggle-switch" style="width:30px; height:16px;"></div>
                    </div>
                </label>
                <button class="primary" onclick="deleteAllVersions()"
                    style="width:100%; justify-content:center; background:#cc3333; border-color:#ax3333;">Delete
                    All</button>
            </div>
        </div>
    </div>

    <div id="batch-view" class="view-container">
        <div class="batch-card">
            <h2 style="margin-top:0"><i class="ri-file-ppt-2-line"></i> Generate HTML Report</h2>
            <p style="color:#888; font-size:13px; margin-bottom:20px;">
                Upload two large files. Python will process them (ignoring comments/regex if requested) and generate a
                standalone HTML diff report.
            </p>

            <div class="file-list">
                <div class="file-item" onclick="document.getElementById('file1').click()" style="cursor:pointer">
                    <i class="ri-file-text-line"></i>
                    <div>
                        <div style="font-size:11px; color:#888;">Original File</div>
                        <div id="name1">Select File...</div>
                    </div>
                    <input type="file" id="file1" hidden onchange="updateFileName(this, 'name1')">
                </div>
                <div class="file-item" onclick="document.getElementById('file2').click()" style="cursor:pointer">
                    <i class="ri-file-add-line"></i>
                    <div>
                        <div style="font-size:11px; color:#888;">New File</div>
                        <div id="name2">Select File...</div>
                    </div>
                    <input type="file" id="file2" hidden onchange="updateFileName(this, 'name2')">
                </div>
            </div>

            <div class="regex-group">
                <label style="color:#fff; font-weight:600;">Ignore Options</label>
                <div style="display:flex; gap:15px; margin-bottom:15px;">
                    <label class="toggle-label">
                        <input type="checkbox" id="ignore-whitespace-batch">
                        <div class="toggle-switch"></div>
                        <span>Whitespace</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="ignore-comments-batch">
                        <div class="toggle-switch"></div>
                        <span>Comments (Hash/Slash)</span>
                    </label>
                </div>

                <label>Custom Regex Ignore Pattern (Optional)</label>
                <input type="text" id="regex-pattern" placeholder="e.g. ^\s*log.*" style="width:100%">
            </div>

            <button class="primary" style="width:100%; margin-top:20px; height:40px; justify-content:center;"
                onclick="generateReport()">
                <i class="ri-download-cloud-2-line"></i> Generate & Download Report
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

    <script>
        let diffEditor;
        let originalModel, modifiedModel;

        // 1. CONFIGURE & LOAD MONACO
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {

            // A. DEFINE CUSTOM THEMES
            monaco.editor.defineTheme('peach', {
                base: 'vs',
                inherit: true,
                rules: [{ background: 'FFF8F0' }],
                colors: {
                    'editor.background': '#FFF8F0',
                    'editor.foreground': '#3E3E3E',
                    'editorLineNumber.foreground': '#D0A080',
                    'diffEditor.insertedTextBackground': '#9bb95540',
                    'diffEditor.removedTextBackground': '#ff000020'
                }
            });

            monaco.editor.defineTheme('midnight', {
                base: 'vs-dark',
                inherit: true,
                rules: [{ background: '0F172A' }],
                colors: {
                    'editor.background': '#0F172A',
                    'editor.foreground': '#CBD5E1',
                    'editorLineNumber.foreground': '#475569',
                }
            });

            // B. CREATE EDITOR
            diffEditor = monaco.editor.createDiffEditor(document.getElementById('editor-container'), {
                theme: 'vs-dark',
                originalEditable: true, // Allow editing left side
                readOnly: false,
                renderSideBySide: true,
                ignoreTrimWhitespace: false,
                renderIndicators: true // Shows the arrows for merging
            });

            originalModel = monaco.editor.createModel("", "text/plain");
            modifiedModel = monaco.editor.createModel("", "text/plain");
            diffEditor.setModel({ original: originalModel, modified: modifiedModel });

            // C. LAYOUT FIX
            window.addEventListener('resize', () => diffEditor.layout());
        });

        // 2. INTERACTIVE ACTIONS
        function changeTheme() {
            const theme = document.getElementById('theme-select').value;
            monaco.editor.setTheme(theme);
            // Update CSS variables for surrounding UI
            const root = document.documentElement.style;
            if (theme === 'vs') {
                root.setProperty('--bg', '#ffffff');
                root.setProperty('--header', '#f3f3f3');
                root.setProperty('--text', '#333333');
                root.setProperty('--border', '#dddddd');
                root.setProperty('--input-bg', '#ffffff');
                root.setProperty('--input-text', '#333333');
                root.setProperty('--tab-active-bg', '#ffffff');
                root.setProperty('--tab-active-text', '#007acc');
            } else if (theme === 'peach') {
                root.setProperty('--bg', '#fff8f0');
                root.setProperty('--header', '#f7eadd');
                root.setProperty('--text', '#4a4036');
                root.setProperty('--border', '#e6d0c0');
                root.setProperty('--input-bg', '#fff8f0');
                root.setProperty('--input-text', '#4a4036');
                root.setProperty('--tab-active-bg', '#fff8f0');
                root.setProperty('--tab-active-text', '#4a4036');
            } else {
                root.setProperty('--bg', '#1e1e1e');
                root.setProperty('--header', '#252526');
                root.setProperty('--text', '#cccccc');
                root.setProperty('--border', '#333333');
                root.setProperty('--input-bg', '#3c3c3c');
                root.setProperty('--input-text', '#ffffff');
                root.setProperty('--tab-active-bg', '#1e1e1e');
                root.setProperty('--tab-active-text', '#ffffff');
            }
        }

        function toggleInline() {
            const isInline = document.getElementById('inline-toggle').checked;
            diffEditor.updateOptions({ renderSideBySide: !isInline });
        }

        function changeLang() {
            const lang = document.getElementById('lang-select').value;
            monaco.editor.setModelLanguage(originalModel, lang);
            monaco.editor.setModelLanguage(modifiedModel, lang);
        }

        function clearAll() {
            originalModel.setValue('');
            modifiedModel.setValue('');
        }

        // 3. UI TAB LOGIC
        function switchView(view) {
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            document.getElementById(view + '-view').classList.add('active');
            document.querySelector(`.tab[onclick="switchView('${view}')"]`).classList.add('active');

            document.getElementById('interactive-toolbar').style.visibility = (view === 'interactive') ? 'visible' : 'hidden';

            if (view === 'interactive' && diffEditor) diffEditor.layout();
        }

        function updateFileName(input, labelId) {
            if (input.files.length) document.getElementById(labelId).innerText = input.files[0].name;
        }

        // 4. BATCH GENERATOR LOGIC
        async function generateReport() {
            const f1 = document.getElementById('file1').files[0];
            const f2 = document.getElementById('file2').files[0];

            if (!f1 || !f2) { alert("Please select both files."); return; }

            const formData = new FormData();
            formData.append('file1', f1);
            formData.append('file2', f2);
            formData.append('ignore_whitespace', document.getElementById('ignore-whitespace-batch').checked);
            formData.append('ignore_comments', document.getElementById('ignore-comments-batch').checked);
            formData.append('regex_pattern', document.getElementById('regex-pattern').value);

            const btn = document.querySelector('.batch-card button');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="ri-loader-4-line ri-spin"></i> Processing...`;

            try {
                const res = await fetch('/api/generate_report', { method: 'POST', body: formData });
                if (!res.ok) throw new Error("Processing failed");

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "diff_report.html";
                document.body.appendChild(a); a.click(); a.remove();
            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                btn.innerHTML = originalText;
            }
        }

        // 5. REGEX IN EDITOR
        function applyEditorRegex() {
            const pattern = document.getElementById('editor-regex').value;
            if (!pattern) return;

            try {
                const regex = new RegExp(pattern);

                [originalModel, modifiedModel].forEach(model => {
                    const lines = model.getValue().split('\n');
                    const filtered = lines.filter(line => !regex.test(line));
                    model.setValue(filtered.join('\n'));
                });
            } catch (e) {
                alert("Invalid Regex: " + e.message);
            }
        }

        // 6. INDENTATION
        function changeIndent() {
            const size = parseInt(document.getElementById('indent-select').value);
            [originalModel, modifiedModel].forEach(model => {
                model.updateOptions({ tabSize: size, insertSpaces: true });
            });
        }

        // 7. VERSIONING SYSTEM
        let savedVersions = [];
        let autoSaveInterval = null;

        function toggleVersions() {
            const sidebar = document.getElementById('version-sidebar');
            sidebar.classList.toggle('collapsed');

            // Layout editor after transition to fill space
            setTimeout(() => diffEditor.layout(), 305);
        }

        function saveVersion(isAuto = false) {
            const content = {
                original: originalModel.getValue(),
                modified: modifiedModel.getValue()
            };

            // Don't save empty if manual? Or maybe allow it. 
            // Don't save if same as last version (for autosave)
            if (isAuto && savedVersions.length > 0) {
                const last = savedVersions[0];
                if (last.content.original === content.original && last.content.modified === content.modified) {
                    return; // No change
                }
            }

            const version = {
                id: Date.now(),
                timestamp: new Date().toLocaleTimeString(),
                type: isAuto ? 'Auto-Save' : 'Manual',
                content: content
            };

            savedVersions.unshift(version);
            renderVersions();
        }

        function renderVersions() {
            const list = document.getElementById('version-list');
            list.innerHTML = '';

            if (savedVersions.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#888; font-size:12px; margin-top:20px;">No saved versions</div>';
                return;
            }

            savedVersions.forEach(v => {
                const item = document.createElement('div');
                item.className = 'version-item';
                item.onclick = () => loadVersion(v.id);
                item.innerHTML = `
                    <div class="version-info" style="display:flex; justify-content:space-between;">
                        <span style="font-weight:bold; color:var(--accent)">${v.type}</span>
                        <span>${v.timestamp}</span>
                    </div>
                    <div style="font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); opacity:0.8;">
                        ${v.content.original.substring(0, 30) || '(empty)'}
                    </div>
                    <div class="version-actions">
                        <button class="close-btn" style="color:red" onclick="event.stopPropagation(); deleteVersion(${v.id})"><i class="ri-close-circle-fill"></i></button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function loadVersion(id) {
            const v = savedVersions.find(ver => ver.id === id);
            if (v) {
                if (confirm("Load this version? Current changes will be overwritten.")) {
                    originalModel.setValue(v.content.original);
                    modifiedModel.setValue(v.content.modified);
                }
            }
        }

        function deleteVersion(id) {
            if (confirm("Delete this version?")) {
                savedVersions = savedVersions.filter(v => v.id !== id);
                renderVersions();
            }
        }

        function deleteAllVersions() {
            if (confirm("Delete ALL versions?")) {
                savedVersions = [];
                renderVersions();
            }
        }

        function updateAutoSave() {
            const enabled = document.getElementById('autosave-toggle').checked;
            const seconds = parseInt(document.getElementById('autosave-interval').value) || 30;

            if (autoSaveInterval) clearInterval(autoSaveInterval);

            if (enabled) {
                autoSaveInterval = setInterval(() => {
                    saveVersion(true);
                }, seconds * 1000);
            }
        }
    </script>

</body>

</html>
